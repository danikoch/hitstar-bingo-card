<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#12121a">
<meta name="description" content="Randomized 5x5 colour bingo cards for Hitstar — pick your own colours, mark fields off, get a bingo.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Hitstar Bingo">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<title>Hitstar Bingo</title>
<style>
  :root {
    --bg: #0e0e14;
    --bg-elev: #191922;
    --bg-elev-2: #23232f;
    --fg: #f4f4f8;
    --fg-dim: #a0a0b0;
    --line: #33333f;
    --accent: #ffd166;
    --marked: .42;
    --radius: 14px;
    --gap: 2.2vmin;
    --safe-t: env(safe-area-inset-top, 0px);
    --safe-b: env(safe-area-inset-bottom, 0px);
  }
  /* Light palette: follows the system unless a theme is forced via
     <html data-theme="light|dark">. Same values in both rules on purpose. */
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --bg: #f2f2f6;
      --bg-elev: #ffffff;
      --bg-elev-2: #e8e8ef;
      --fg: #16161c;
      --fg-dim: #63636f;
      --line: #d5d5de;
      --accent: #d98e00;   /* readable amber on a light background */
      --marked: .5;
    }
  }
  :root[data-theme="light"] {
    --bg: #f2f2f6;
    --bg-elev: #ffffff;
    --bg-elev-2: #e8e8ef;
    --fg: #16161c;
    --fg-dim: #63636f;
    --line: #d5d5de;
    --accent: #d98e00;
    --marked: .5;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; height: 100%;
    overscroll-behavior: none;
  }
  body {
    background: var(--bg);
    color: var(--fg);
    font: 500 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: grid;
    grid-template-areas: "head" "card" "note";
    grid-template-rows: auto 1fr auto;
    gap: 12px;
    padding: calc(var(--safe-t) + 10px) 12px calc(var(--safe-b) + 10px);
    height: 100dvh;
    user-select: none; -webkit-user-select: none;
  }
  header { grid-area: head; }
  main { grid-area: card; }
  #note-wrap { grid-area: note; }

  /* ---------- header ---------- */
  header {
    display: flex; align-items: center; gap: 10px;
  }
  h1 {
    font-size: clamp(15px, 4.4vw, 21px);
    letter-spacing: .14em; text-transform: uppercase;
    margin: 0; flex: 1; font-weight: 800;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  h1 span { color: var(--accent); }
  .icon-btn {
    flex: 0 0 auto;
    width: 42px; height: 42px; border-radius: 12px;
    display: grid; place-items: center;
    background: var(--bg-elev); color: var(--fg);
    border: 1px solid var(--line); cursor: pointer;
    transition: transform .12s, background .15s;
  }
  .icon-btn:active { transform: scale(.92); background: var(--bg-elev-2); }
  .icon-btn svg { width: 21px; height: 21px; stroke: currentColor; fill: none;
                  stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

  /* ---------- card ---------- */
  main {
    min-height: 0; min-width: 0;
    display: flex; align-items: center; justify-content: center;
  }
  #card {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    grid-template-rows: repeat(5, 1fr);
    gap: var(--gap);
    /* --side is measured in JS so the card is a perfect square on every screen */
    width: var(--side, 100%);
    height: var(--side, auto);
    aspect-ratio: 1 / 1;
  }
  .cell {
    position: relative;
    border: none; padding: 0; margin: 0;
    border-radius: var(--radius);
    background: var(--c);
    cursor: pointer;
    touch-action: manipulation;   /* no double-tap zoom / 300ms delay */
    transition: transform .13s cubic-bezier(.34,1.56,.64,1), box-shadow .2s, opacity .2s;
    box-shadow: inset 0 -3px 0 rgba(0,0,0,.18);
    overflow: hidden;
  }
  .cell:active { transform: scale(.93); }
  .cell::after {              /* the tick shown when marked off */
    content: "";
    position: absolute; inset: 0;
    background-image: var(--tick);
    background-repeat: no-repeat;
    background-position: center;
    background-size: 52%;
    opacity: 0; transform: scale(.4) rotate(-25deg);
    transition: opacity .18s, transform .22s cubic-bezier(.34,1.56,.64,1);
  }
  .cell.marked { opacity: var(--marked); box-shadow: inset 0 0 0 2px rgba(0,0,0,.25); }
  .cell.marked::after { opacity: 1; transform: none; }

  .cell.in-bingo { opacity: 1; animation: pop .45s ease; }
  .cell.in-bingo::before {
    content: "";
    position: absolute; inset: 0;
    border-radius: inherit;
    box-shadow: inset 0 0 0 3px var(--fg), 0 0 14px -2px var(--accent);
  }
  @keyframes pop { 40% { transform: scale(1.09); } }

  /* ---------- note (readable across the table) ---------- */
  #note-wrap {
    position: relative;
    height: clamp(74px, 21dvh, 210px);
    min-width: 0;
    background: var(--bg-elev);
    border: 1px solid var(--line);
    border-radius: var(--radius);
  }
  /* :has(), not :focus-within — the toolbar buttons live inside the panel, so
     focus-within lit the border up after tapping any of them, which reads as
     "you are typing here" when you are not. */
  #note-wrap:has(#note:focus) { border-color: var(--accent); }
  #note-wrap.empty { border-style: dashed; }
  /* The measuring element must match the textarea in everything but font-size,
     so both take their typography from here. Nothing is copied in JS: a computed
     line-height or letter-spacing is relative to the *current* font size and
     would make the fitted size chase its own tail. */
  #note, #note-measure {
    font-family: inherit;
    font-weight: 800;
    line-height: 1.08;
    letter-spacing: -.01em;
    text-align: center;
  }
  #note {
    width: 100%; height: 100%;
    padding: 10px 14px;           /* padding-top is adjusted in JS to centre the text */
    background: none; border: none; outline: none; resize: none;
    color: var(--fg);
    font-size: 20px;              /* replaced by the fitted size */
    overflow: hidden;             /* fitNote() turns scrolling on only if needed */
    display: block;
  }
  /* The text no longer needs side room for the buttons: fitNote() reserves the
     toolbar's own strip along the top instead, which leaves the full width for
     text. fitNote() reads the paddings from here, so this is the only place
     that decides the text box. */
  #note::placeholder { font-weight: 600; font-size: 15px; color: var(--fg-dim); letter-spacing: 0; }

  /* the drawing layer sits above the text so strokes can annotate it,
     and only takes pointer events while draw mode is on */
  #ink {
    position: absolute; inset: 0; z-index: 1;
    width: 100%; height: 100%;
    border-radius: inherit;
    pointer-events: none;
  }
  body.note-draw #ink { pointer-events: auto; touch-action: none; }
  body.note-draw #note { pointer-events: none; }
  body.note-draw #note::placeholder { color: transparent; }

  #note-tools {
    position: absolute; z-index: 2;
    top: 6px; right: 6px;
    display: flex; gap: 4px;
  }
  #note-tools button {
    width: 32px; height: 32px; border-radius: 9px;
    display: grid; place-items: center;
    background: var(--bg-elev-2); color: var(--fg-dim);
    border: 1px solid var(--line);
    cursor: pointer; touch-action: manipulation;
  }
  #note-tools button:active { transform: scale(.9); }
  #note-tools button[hidden] { display: none; }   /* beats the display:grid above */
  #note-tools svg {
    width: 17px; height: 17px; stroke: currentColor; fill: none;
    stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;
  }
  #note-mode[aria-pressed="true"], #note-erase[aria-pressed="true"] {
    background: var(--accent); color: #16161c; border-color: transparent;
  }

  /* ---------- note fullscreen ---------- */
  body.note-full #note-wrap {
    position: fixed; inset: 0; z-index: 60;
    height: auto; margin: 0;
    border: none; border-radius: 0;
    background: var(--bg);
  }
  body.note-full #note {
    padding-bottom: calc(var(--safe-b) + 14px);
    padding-left: 20px; padding-right: 20px;
  }
  body.note-full #note-tools { top: calc(var(--safe-t) + 8px); right: 10px; }
  body.note-full #note-tools button { width: 38px; height: 38px; border-radius: 11px; }
  body.note-full #note-tools svg { width: 20px; height: 20px; }

  #note-measure {
    position: absolute; left: -9999px; top: 0;
    visibility: hidden; pointer-events: none;
    white-space: pre-wrap; overflow-wrap: break-word;
  }

  /* ---------- bingo banner ---------- */
  #banner {
    position: fixed; inset: 0;
    display: grid; place-items: center;
    pointer-events: none; z-index: 40;
    opacity: 0; transition: opacity .25s;
  }
  #banner.show { opacity: 1; }
  #banner::before {          /* darkens the tiles so the word stays readable */
    content: "";
    position: absolute; inset: 0;
    background: radial-gradient(ellipse 70% 26% at 50% 50%, rgba(0,0,0,.82), transparent 70%);
  }
  #banner strong {
    position: relative;
    font-size: clamp(46px, 19vw, 130px);
    font-weight: 900; letter-spacing: .04em;
    color: var(--accent);
    text-shadow: 0 6px 30px rgba(0,0,0,.55);
    animation: bingo .6s cubic-bezier(.34,1.56,.64,1);
  }
  @keyframes bingo {
    0% { transform: scale(.3) rotate(-12deg); opacity: 0; }
    100% { transform: none; opacity: 1; }
  }
  .confetti {
    position: fixed; top: -14px; width: 9px; height: 15px;
    z-index: 39; pointer-events: none; border-radius: 2px;
    animation: fall linear forwards;
  }
  @keyframes fall {
    to { transform: translateY(105dvh) rotate(720deg); opacity: .1; }
  }
  @media (prefers-reduced-motion: reduce) {
    .confetti { display: none; }
    *, *::before, *::after { animation-duration: .01ms !important; }
  }

  /* ---------- category wheel ---------- */
  #wheel-view {
    position: fixed; inset: 0; z-index: 80;
    background: var(--bg);
    display: grid;
    grid-template-areas: "close" "stage" "band";
    grid-template-rows: auto 1fr auto;
    gap: 10px;
    padding: calc(var(--safe-t) + 10px) 12px calc(var(--safe-b) + 12px);
  }
  #wheel-view[hidden] { display: none; }
  #wheel-close { grid-area: close; justify-self: end; }
  #wheel-stage {
    grid-area: stage;
    display: grid; place-items: center;
    min-height: 0; min-width: 0;
  }
  /* --wside is measured in JS, like the card: the wheel has to stay a circle */
  #wheel-box {
    position: relative;
    width: var(--wside, 100%); height: var(--wside, auto);
    transition: opacity .3s;
  }
  #wheel {
    width: 100%; height: 100%;
    display: block; border-radius: 50%;
    cursor: pointer; touch-action: manipulation;
    box-shadow: 0 14px 40px -14px rgba(0, 0, 0, .6);
  }
  #wheel-pin {                      /* stays put while the wheel turns under it */
    position: absolute; top: -7px; left: 50%;
    transform: translateX(-50%);
    width: 0; height: 0; z-index: 2;
    border-left: 12px solid transparent;
    border-right: 12px solid transparent;
    border-top: 23px solid var(--fg);
    filter: drop-shadow(0 2px 3px rgba(0, 0, 0, .45));
  }
  #wheel-hint, #wheel-band { grid-area: band; }
  #wheel-hint {
    margin: 0; align-self: center; text-align: center;
    color: var(--fg-dim); font-size: 14px;
  }
  #wheel-band {
    display: grid; place-items: center;
    height: clamp(96px, 20dvh, 190px);
    border-radius: var(--radius);
    padding: 8px 16px;
    overflow: hidden;
  }
  #wheel-band[hidden] { display: none; }
  #wheel-cat {
    font-weight: 800; letter-spacing: -.01em; line-height: 1.05;
    text-align: center;
    font-size: 28px;                /* replaced by the fitted size */
  }
  #wheel-view.has-result #wheel-box { opacity: .6; }
  #wheel-view.has-result #wheel-hint { display: none; }
  #wheel-view.spinning #wheel { cursor: default; }

  /* ---------- confirmation dialog ---------- */
  #ask {
    position: fixed; z-index: 70;
    left: 50%; top: 50%; transform: translate(-50%, -50%);
    width: min(340px, calc(100vw - 40px));
    background: var(--bg-elev);
    border: 1px solid var(--line);
    border-radius: 18px;
    padding: 20px 18px 16px;
    box-shadow: 0 18px 50px -12px rgba(0, 0, 0, .55);
  }
  #ask[hidden] { display: none; }
  #ask p { margin: 0 0 16px; font-size: 15.5px; line-height: 1.45; }
  .ask-actions { display: flex; gap: 8px; }
  .ask-actions button {
    flex: 1; padding: 12px; border-radius: 11px;
    background: var(--bg-elev-2); color: var(--fg);
    border: 1px solid var(--line);
    font: 600 15px system-ui, sans-serif; cursor: pointer;
    touch-action: manipulation;
  }
  .ask-actions button.primary { background: var(--accent); color: #16161c; border-color: transparent; }
  .ask-actions button:active { transform: scale(.98); }

  /* ---------- settings sheet ---------- */
  #scrim {
    position: fixed; inset: 0; background: rgba(0,0,0,.55);
    opacity: 0; pointer-events: none; transition: opacity .25s; z-index: 50;
  }
  #scrim.show { opacity: 1; pointer-events: auto; }
  #sheet {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 51;
    background: var(--bg-elev);
    border-radius: 22px 22px 0 0;
    border-top: 1px solid var(--line);
    padding: 8px 16px calc(var(--safe-b) + 18px);
    transform: translateY(101%);
    transition: transform .3s cubic-bezier(.32,.72,0,1);
    max-height: 88dvh; overflow-y: auto;
    max-width: 560px; margin: 0 auto;
  }
  #sheet.show { transform: none; }
  .grabber { width: 42px; height: 4px; border-radius: 2px; background: var(--line);
             margin: 4px auto 14px; }
  #sheet h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .1em;
              color: var(--fg-dim); margin: 22px 0 10px; }
  #sheet h2:first-of-type { margin-top: 4px; }

  .row {
    display: flex; align-items: center; gap: 12px;
    padding: 9px 0;
  }
  .row + .row { border-top: 1px solid var(--line); }
  .swatch {
    flex: 0 0 auto; width: 40px; height: 40px; border-radius: 11px;
    border: 1px solid rgba(128,128,128,.35); padding: 0; overflow: hidden;
    background: none; cursor: pointer; position: relative;
  }
  .swatch input {
    position: absolute; inset: -20%; width: 140%; height: 140%;
    border: none; padding: 0; background: none; cursor: pointer;
  }
  .name {
    flex: 1 1 auto; min-width: 0;
    background: transparent; border: none; color: var(--fg);
    font: inherit; padding: 6px 0;
  }
  .name:focus { outline: none; border-bottom: 1px solid var(--accent); }
  .del {
    flex: 0 0 auto; width: 34px; height: 34px; border-radius: 9px;
    background: var(--bg-elev-2); border: 1px solid var(--line);
    color: var(--fg-dim); cursor: pointer; font-size: 18px; line-height: 1;
  }
  .del:disabled { opacity: .3; cursor: not-allowed; }

  button.wide {
    width: 100%; padding: 13px; border-radius: 12px;
    background: var(--bg-elev-2); color: var(--fg);
    border: 1px solid var(--line); font: 600 15px system-ui, sans-serif;
    cursor: pointer; margin-top: 12px;
  }
  button.wide:active { transform: scale(.985); }
  button.wide.primary { background: var(--accent); color: #16161c; border-color: transparent; }

  .toggle { display: flex; align-items: center; gap: 12px; padding: 11px 0; cursor: pointer; }
  .toggle + .toggle { border-top: 1px solid var(--line); }
  .toggle span { flex: 1; }
  .toggle small { display: block; color: var(--fg-dim); font-size: 12.5px; font-weight: 400; }
  .toggle input { appearance: none; margin: 0; flex: 0 0 auto;
                  width: 46px; height: 28px; border-radius: 14px;
                  background: var(--bg-elev-2); border: 1px solid var(--line);
                  position: relative; cursor: pointer; transition: background .2s; }
  .toggle input::after {
    content: ""; position: absolute; top: 3px; left: 3px;
    width: 20px; height: 20px; border-radius: 50%;
    background: var(--fg-dim); transition: transform .2s, background .2s;
  }
  .toggle input:checked { background: var(--accent); border-color: transparent; }
  .toggle input:checked::after { transform: translateX(18px); background: #16161c; }

  .presets { display: flex; gap: 8px; flex-wrap: wrap; }
  .preset {
    display: flex; padding: 0; border-radius: 10px; overflow: hidden;
    border: 1px solid var(--line); cursor: pointer; background: none; height: 34px;
  }
  .preset i { width: 17px; display: block; }
  .hint { color: var(--fg-dim); font-size: 12.5px; margin: 10px 0 0; line-height: 1.5; }

  /* ---------- landscape: field beside the card ----------
     Kept last in the sheet: these have the same specificity as the rules
     they override (#note-wrap's height, #card's width), so source order is
     what decides.

     Landscape: the field moves beside the card instead of under it. Stacked,
     the two compete for the same height and both end up cramped; side by side
     the card takes the full height and the field takes the width left over.
     Gated on a width as well, so a narrow or nearly square window keeps the
     stacked layout, where a 50/50 split would look wrong. */
  @media (orientation: landscape) and (min-width: 620px) {
    body {
      grid-template-areas: "head head" "card note";
      /* fit() replaces the first track with the card's exact width. An `auto`
         track cannot work here: its width would come from the card, whose
         width comes from its height, which comes from this row — a cycle the
         browser resolves differently before and after layout, so the grid
         never settles. */
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      grid-template-rows: auto 1fr;
    }
    /* 100%, not auto: an auto-height grid item grows to fit its own content,
       and this one's content is text sized to fit the box — the box would grow
       from the text, the row from the box, the card from the row, and the text
       would refit into the bigger box, over and over. min-height:0 keeps the
       track's automatic minimum out of it too. */
    #note-wrap { height: 100%; min-height: 0; }

    #wheel-view {
      grid-template-areas: "close close" "stage band";
      grid-template-columns: 1fr minmax(200px, 38%);
      grid-template-rows: auto 1fr;
    }
    #wheel-band { height: 100%; min-height: 0; }
  }
</style>
</head>
<body>

<header>
  <h1>Hitstar <span>Bingo</span></h1>
  <button class="icon-btn" id="btn-wheel" aria-label="Open the category wheel" title="Category wheel">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 3v18M3 12h18M5.6 5.6l12.8 12.8M18.4 5.6L5.6 18.4"/></svg>
  </button>
  <button class="icon-btn" id="btn-new" aria-label="New card" title="New card">
    <svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 0 1 15.3-6.4L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-15.3 6.4L3 16"/><path d="M3 21v-5h5"/></svg>
  </button>
  <button class="icon-btn" id="btn-settings" aria-label="Settings" title="Colours &amp; settings">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1A1.7 1.7 0 0 0 8.9 19a1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1A1.7 1.7 0 0 0 5 8.9a1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3H9.5a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9v.1a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
  </button>
</header>

<main><div id="card" role="grid" aria-label="Bingo card"></div></main>

<div id="note-wrap" class="empty">
  <textarea id="note" placeholder="Tap to write — the text scales to fill the field"
            aria-label="Note, shown large enough to read across the table"
            autocomplete="off" autocapitalize="sentences" spellcheck="false"></textarea>
  <canvas id="ink" aria-label="Drawing surface" role="img"></canvas>
  <div id="note-tools">
    <button id="note-mode" aria-label="Switch to drawing" title="Draw">
      <svg viewBox="0 0 24 24"><path d="M16.5 3.5l4 4L8 20H4v-4L16.5 3.5z"/><path d="M14 6l4 4"/></svg>
    </button>
    <button id="note-undo" aria-label="Undo the last stroke" title="Undo" hidden>
      <svg viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a5.5 5.5 0 0 1 0 11H9"/></svg>
    </button>
    <button id="note-erase" aria-label="Eraser" title="Eraser" aria-pressed="false" hidden>
      <svg viewBox="0 0 24 24"><path d="M20 20H9l-5-5a2 2 0 0 1 0-2.8l7.6-7.6a2 2 0 0 1 2.8 0l5 5a2 2 0 0 1 0 2.8L12 20"/></svg>
    </button>
    <button id="note-full" aria-label="Show fullscreen" title="Fullscreen">
      <svg viewBox="0 0 24 24"><path d="M15 4h5v5"/><path d="M9 20H4v-5"/><path d="M20 4l-7 7"/><path d="M4 20l7-7"/></svg>
    </button>
    <button id="note-clear" aria-label="Clear the text" title="Clear" hidden>
      <svg viewBox="0 0 24 24"><path d="M6 6l12 12"/><path d="M18 6L6 18"/></svg>
    </button>
  </div>
  <div id="note-measure" aria-hidden="true"></div>
</div>


<div id="banner" aria-live="polite"><strong>BINGO!</strong></div>

<section id="wheel-view" role="dialog" aria-modal="true" aria-label="Category wheel" hidden>
  <button class="icon-btn" id="wheel-close" aria-label="Close the wheel" title="Close">
    <svg viewBox="0 0 24 24"><path d="M6 6l12 12"/><path d="M18 6L6 18"/></svg>
  </button>
  <div id="wheel-stage">
    <div id="wheel-box">
      <canvas id="wheel" role="img"></canvas>
      <div id="wheel-pin"></div>
    </div>
  </div>
  <p id="wheel-hint">Tap the wheel to spin</p>
  <div id="wheel-band" aria-live="polite" hidden><span id="wheel-cat"></span></div>
</section>

<div id="scrim"></div>
<div id="ask" role="dialog" aria-modal="true" aria-labelledby="ask-text" hidden>
  <p id="ask-text"></p>
  <div class="ask-actions">
    <button id="ask-no">Cancel</button>
    <button id="ask-yes" class="primary">New card</button>
  </div>
</div>
<section id="sheet" role="dialog" aria-label="Colours and settings" aria-modal="true">
  <div class="grabber"></div>

  <h2>Colours</h2>
  <div id="palette"></div>
  <button class="wide" id="btn-add">+ Add colour</button>

  <h2>Presets</h2>
  <div class="presets" id="presets"></div>

  <h2>Card</h2>
  <label class="toggle">
    <span>Even distribution
      <small>Spread the colours evenly over the 25 fields instead of drawing each field independently.</small></span>
    <input type="checkbox" id="opt-even">
  </label>
  <label class="toggle">
    <span>Avoid neighbouring twins
      <small>Try to keep identical colours from sitting next to each other.</small></span>
    <input type="checkbox" id="opt-spread">
  </label>
  <label class="toggle">
    <span>Vibration
      <small>Short buzz when you mark a field (not supported on iOS).</small></span>
    <input type="checkbox" id="opt-haptics">
  </label>

  <button class="wide primary" id="btn-new-2">New card</button>
  <button class="wide" id="btn-clear">Clear all marks</button>
  <button class="wide" id="btn-install" hidden>Install on home screen</button>
  <p class="hint" id="hint">Tap a field to mark it off, tap again to undo. Your card, marks and colours are
     saved on this device — closing the browser will not lose the game.</p>
  <button class="wide" id="btn-close">Close</button>
</section>

<script>
(() => {
  "use strict";

  const SIZE = 5, CELLS = SIZE * SIZE, KEY = "hitstar-bingo-v1";

  const PRESETS = [
    { name: "Hitstar",  colors: ["#e63946", "#f77f00", "#fcbf49", "#2a9d8f", "#4361ee"] },
    { name: "Neon",     colors: ["#ff006e", "#fb5607", "#ffbe0b", "#8338ec", "#3a86ff"] },
    { name: "Pastel",   colors: ["#ffadad", "#ffd6a5", "#fdffb6", "#caffbf", "#a0c4ff"] },
    { name: "Retro",    colors: ["#264653", "#2a9d8f", "#e9c46a", "#f4a261", "#e76f51"] },
    { name: "Six",      colors: ["#ef476f", "#ffd166", "#06d6a0", "#118ab2", "#8e7dbe", "#f78c6b"] },
  ];

  const uid = () => Math.random().toString(36).slice(2, 9);
  const defaultPalette = () =>
    PRESETS[0].colors.map((c, i) => ({ id: uid(), color: c, name: "Colour " + (i + 1) }));

  /* ------------------------------------------------------------------ state */

  let state = load() || {
    v: 1,
    palette: defaultPalette(),
    settings: { even: true, spread: true, haptics: true },
    card: null,        // [{ catId, color }] – colour is the fallback if the category is deleted
    marks: [],
    seen: [],          // indexes of bingo lines already celebrated
    note: "",
    ink: [],           // strokes, see the drawing section
  };

  function load() {
    try {
      const raw = localStorage.getItem(KEY);
      if (!raw) return null;
      const s = JSON.parse(raw);
      if (!s || s.v !== 1 || !Array.isArray(s.palette) || !s.palette.length) return null;
      if (!Array.isArray(s.marks) || s.marks.length !== CELLS) s.marks = new Array(CELLS).fill(false);
      if (!Array.isArray(s.card) || s.card.length !== CELLS) s.card = null;
      s.settings = Object.assign({ even: true, spread: true, haptics: true }, s.settings);
      s.seen = Array.isArray(s.seen) ? s.seen : [];
      s.note = typeof s.note === "string" ? s.note : "";
      s.ink = Array.isArray(s.ink) ? s.ink.filter((k) => Array.isArray(k) && k.length >= 2) : [];
      return s;
    } catch { return null; }
  }

  let saveTimer;
  function save() {
    clearTimeout(saveTimer);
    saveTimer = setTimeout(() => {
      try { localStorage.setItem(KEY, JSON.stringify(state)); } catch { /* private mode */ }
    }, 120);
  }

  /* ------------------------------------------------------- card generation */

  const shuffle = (a) => {
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  };

  // number of neighbouring pairs sharing a category
  function clumpScore(cells) {
    let n = 0;
    for (let r = 0; r < SIZE; r++) {
      for (let c = 0; c < SIZE; c++) {
        const i = r * SIZE + c;
        if (c < SIZE - 1 && cells[i].catId === cells[i + 1].catId) n++;
        if (r < SIZE - 1 && cells[i].catId === cells[i + SIZE].catId) n++;
      }
    }
    return n;
  }

  function drawCells() {
    const pal = state.palette;
    const pick = [];
    if (state.settings.even) {
      // hand every colour the same share, then raffle off the remainder
      const base = Math.floor(CELLS / pal.length);
      for (const cat of pal) for (let i = 0; i < base; i++) pick.push(cat);
      const rest = shuffle(pal.slice()).slice(0, CELLS - pick.length);
      pick.push(...rest);
      shuffle(pick);
    } else {
      for (let i = 0; i < CELLS; i++) pick.push(pal[Math.floor(Math.random() * pal.length)]);
    }
    return pick.map((cat) => ({ catId: cat.id, color: cat.color }));
  }

  function newCard() {
    let best = drawCells();
    if (state.settings.spread && state.palette.length > 1) {
      let bestScore = clumpScore(best);
      for (let t = 0; t < 60 && bestScore > 0; t++) {
        const cand = drawCells();
        const score = clumpScore(cand);
        if (score < bestScore) { best = cand; bestScore = score; }
      }
    }
    state.card = best;
    state.marks = new Array(CELLS).fill(false);
    state.seen = [];
    state.ink = [];        // the drawing belongs to the round that just ended
    undos = [];
    save();
    render();
    layoutNote();
  }

  /* ---------------------------------------------------------------- bingo */

  const LINES = (() => {
    const l = [];
    for (let r = 0; r < SIZE; r++) l.push(Array.from({ length: SIZE }, (_, c) => r * SIZE + c));
    for (let c = 0; c < SIZE; c++) l.push(Array.from({ length: SIZE }, (_, r) => r * SIZE + c));
    l.push(Array.from({ length: SIZE }, (_, i) => i * SIZE + i));
    l.push(Array.from({ length: SIZE }, (_, i) => i * SIZE + (SIZE - 1 - i)));
    return l;
  })();

  const completedLines = () =>
    LINES.map((line, i) => (line.every((i2) => state.marks[i2]) ? i : -1)).filter((i) => i >= 0);

  /* --------------------------------------------------------------- render */

  const $ = (sel) => document.querySelector(sel);
  const cardEl = $("#card");

  // white or black tick, whichever survives on the given background
  const luminance = (hex) => {
    const n = parseInt(hex.slice(1), 16);
    const f = (v) => { v /= 255; return v <= .03928 ? v / 12.92 : ((v + .055) / 1.055) ** 2.4; };
    return .2126 * f((n >> 16) & 255) + .7152 * f((n >> 8) & 255) + .0722 * f(n & 255);
  };
  const tick = (hex) => {
    const stroke = luminance(hex) > .45 ? "%23000" : "%23fff";
    return `url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='${stroke}' stroke-width='3.4' stroke-linecap='round' stroke-linejoin='round'><path d='M4.5 12.8l5 5 10-11'/></svg>")`;
  };

  // the live colour of a field: follows the palette, falls back to the snapshot
  const colorOf = (cell) => {
    const cat = state.palette.find((p) => p.id === cell.catId);
    return cat ? cat.color : cell.color;
  };
  const nameOf = (catId) => (state.palette.find((p) => p.id === catId) || {}).name;

  function render() {
    const bingo = new Set(completedLines().flatMap((i) => LINES[i]));

    cardEl.replaceChildren(...state.card.map((cell, i) => {
      const c = colorOf(cell);
      const b = document.createElement("button");
      b.className = "cell" + (state.marks[i] ? " marked" : "") + (bingo.has(i) ? " in-bingo" : "");
      b.style.setProperty("--c", c);
      b.style.setProperty("--tick", tick(c));
      b.dataset.i = i;
      b.setAttribute("role", "gridcell");
      b.setAttribute("aria-pressed", String(!!state.marks[i]));
      const label = nameOf(cell.catId) || c;
      b.setAttribute("aria-label",
        `${label}, row ${Math.floor(i / SIZE) + 1} column ${(i % SIZE) + 1}` +
        (state.marks[i] ? ", marked" : ""));
      return b;
    }));
  }

  /* ------------------------------------------------------------ marking */

  cardEl.addEventListener("click", (e) => {
    const btn = e.target.closest(".cell");
    if (!btn) return;
    const i = +btn.dataset.i;
    state.marks[i] = !state.marks[i];

    if (state.marks[i] && state.settings.haptics && navigator.vibrate) navigator.vibrate(12);

    const done = completedLines();
    const fresh = done.filter((l) => !state.seen.includes(l));
    state.seen = done;
    save();
    render();
    if (fresh.length) celebrate();
  });

  /* --------------------------------------------------------- celebration */

  const banner = $("#banner");
  let bannerTimer;
  function celebrate() {
    if (navigator.vibrate && state.settings.haptics) navigator.vibrate([30, 60, 30, 60, 120]);
    banner.classList.remove("show");
    void banner.offsetWidth;                       // restart the animation
    banner.classList.add("show");
    clearTimeout(bannerTimer);
    bannerTimer = setTimeout(() => banner.classList.remove("show"), 1900);

    if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    const colors = state.palette.map((p) => p.color);
    for (let i = 0; i < 46; i++) {
      const p = document.createElement("div");
      p.className = "confetti";
      p.style.left = Math.random() * 100 + "vw";
      p.style.background = colors[i % colors.length];
      p.style.animationDuration = 1.6 + Math.random() * 1.4 + "s";
      p.style.animationDelay = Math.random() * .35 + "s";
      document.body.appendChild(p);
      setTimeout(() => p.remove(), 3600);
    }
  }

  /* ---------------------------------------------------------------- note */

  const noteWrap = $("#note-wrap"), noteEl = $("#note"),
        noteClear = $("#note-clear"), measure = $("#note-measure");
  const tools = $("#note-tools");
  const MIN_PT = 13, MAX_PT = 900;
  /* A textarea wraps about a pixel earlier than a div of the same width. That
     normally goes unnoticed, but the search below converges on exactly the size
     where a line break flips, so the two disagree precisely where it hurts.
     Measuring against a slightly narrower box keeps the estimate on the safe
     side: the div never uses fewer lines than the textarea will. */
  const SAFE = 2;

  // Grow the text to the largest size that still fits the panel, then centre it.
  function fitNote() {
    const text = noteEl.value;
    if (!text.trim()) {
      noteEl.style.fontSize = "";
      noteEl.style.paddingTop = "";
      return;
    }

    // Paddings come from CSS; padding-bottom doubles as the vertical base
    // because padding-top is what this function writes. The toolbar's strip is
    // reserved along the top so no line of text can run underneath it.
    const cs = getComputedStyle(noteEl);
    const padY = parseFloat(cs.paddingBottom);
    const padX = parseFloat(cs.paddingLeft) + parseFloat(cs.paddingRight);
    const strip = tools.offsetHeight + 6;
    const boxH = noteEl.clientHeight - 2 * padY - strip;
    if (noteEl.clientWidth - padX <= 0 || boxH <= 0) return;

    // a trailing newline has no height of its own unless something follows it
    measure.textContent = text.endsWith("\n") ? text + " " : text;

    /* Scroll only as a last resort. A classic scrollbar (desktop, and older
       mobile browsers) eats into the text width the moment it appears, which
       re-wraps the text and invalidates the size we just measured. So the
       textarea stays overflow:hidden while the text fits, and only text that is
       still too long at the minimum size gets a scrollbar. */
    measure.style.width = (noteEl.clientWidth - padX - SAFE) + "px";
    measure.style.fontSize = MIN_PT + "px";
    noteEl.style.overflowY = measure.scrollHeight > boxH + .5 ? "auto" : "hidden";

    const boxW = noteEl.clientWidth - padX - SAFE;   // re-read: a scrollbar may have appeared
    measure.style.width = boxW + "px";

    let lo = MIN_PT, hi = Math.min(MAX_PT, boxH + 4), best = MIN_PT;
    for (let i = 0; i < 10; i++) {
      const mid = (lo + hi) / 2;
      measure.style.fontSize = mid + "px";
      const fits = measure.scrollWidth <= boxW + 0.5 && measure.scrollHeight <= boxH + 0.5;
      if (fits) { best = mid; lo = mid; } else { hi = mid; }
    }

    noteEl.style.fontSize = best.toFixed(1) + "px";

    // Centre on the height of the line boxes (getBoundingClientRect), not on
    // scrollHeight: with a line-height this tight the glyphs overflow their line
    // box, which is the right thing to be cautious about when fitting, but it
    // would push the text off centre by a couple of pixels here.
    measure.style.fontSize = best + "px";
    const linesH = measure.getBoundingClientRect().height;
    noteEl.style.paddingTop = (padY + strip + Math.max(0, (boxH - linesH) / 2)) + "px";
  }

  /* ----------------------------------------------------------- drawing */

  const ink = $("#ink"), ictx = ink.getContext("2d");
  const modeBtn = $("#note-mode"), undoBtn = $("#note-undo"), eraseBtn = $("#note-erase");
  const PEN = .015;         // pen width, as a fraction of the field's width
  const ERASER = .04;       // eraser radius, likewise
  const MAX_UNDO = 25, MAX_POINTS = 24000;

  let drawMode = false, eraseMode = false;
  let live = null;          // the stroke being drawn right now
  let pointer = null;       // id of the finger/pen we are following
  let undos = [];

  /* Strokes are flat [x0,y0,x1,y1,…] arrays. Both axes are divided by the
     field's *width*, so a stroke never distorts when the field changes shape —
     unlike normalising y by the height. inkY then shifts the drawing so it sits
     centred vertically in whatever box it is rendered into; it is recomputed
     only on a layout change, never mid-stroke, or the ink would crawl while
     drawing. */
  let inkY = 0;

  const inkW = () => ink.clientWidth;
  const toX = (nx) => nx * inkW();
  const toY = (ny) => ny * inkW() + inkY;

  function localPoint(e) {
    const r = ink.getBoundingClientRect();
    const w = inkW() || 1;
    return [(e.clientX - r.left) / w, (e.clientY - r.top - inkY) / w];
  }

  function centreInk() {
    const w = inkW(), h = ink.clientHeight;
    inkY = 0;
    if (!state.ink.length || !w) return;
    let lo = Infinity, hi = -Infinity;
    for (const s of state.ink) {
      for (let i = 1; i < s.length; i += 2) {
        if (s[i] < lo) lo = s[i];
        if (s[i] > hi) hi = s[i];
      }
    }
    if (lo === Infinity) return;
    inkY = (h - (hi - lo) * w) / 2 - lo * w;
  }

  function strokePath(s) {
    const n = s.length / 2;
    if (n === 1) {                       // a tap is a dot
      ictx.beginPath();
      ictx.arc(toX(s[0]), toY(s[1]), ictx.lineWidth / 2, 0, Math.PI * 2);
      ictx.fill();
      return;
    }
    ictx.beginPath();
    ictx.moveTo(toX(s[0]), toY(s[1]));
    for (let i = 1; i < n - 1; i++) {    // smooth: curve through the midpoints
      const cx = toX(s[i * 2]), cy = toY(s[i * 2 + 1]);
      ictx.quadraticCurveTo(cx, cy,
        (cx + toX(s[i * 2 + 2])) / 2, (cy + toY(s[i * 2 + 3])) / 2);
    }
    ictx.lineTo(toX(s[(n - 1) * 2]), toY(s[(n - 1) * 2 + 1]));
    ictx.stroke();
  }

  function renderInk() {
    const w = inkW(), h = ink.clientHeight;
    if (!w || !h) return;
    const dpr = Math.min(devicePixelRatio || 1, 3);
    const W = Math.round(w * dpr), H = Math.round(h * dpr);
    if (ink.width !== W || ink.height !== H) { ink.width = W; ink.height = H; }
    ictx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ictx.clearRect(0, 0, w, h);
    ictx.strokeStyle = ictx.fillStyle = getComputedStyle(noteEl).color;
    ictx.lineCap = ictx.lineJoin = "round";
    ictx.lineWidth = Math.max(1.5, PEN * w);
    for (const s of state.ink) strokePath(s);
    if (live) strokePath(live);
  }

  function pushUndo() {
    undos.push(JSON.stringify(state.ink));
    if (undos.length > MAX_UNDO) undos.shift();
  }

  // Erasing splits a stroke into the runs of points the eraser missed, so you
  // rub out part of a line instead of losing the whole thing.
  function eraseAt(nx, ny) {
    const r2 = ERASER * ERASER;
    let hit = false;
    const kept = [];
    for (const s of state.ink) {
      let run = [];
      const runs = [];
      for (let i = 0; i < s.length; i += 2) {
        const dx = s[i] - nx, dy = s[i + 1] - ny;
        if (dx * dx + dy * dy <= r2) {
          hit = true;
          if (run.length) { runs.push(run); run = []; }
        } else run.push(s[i], s[i + 1]);
      }
      if (run.length) runs.push(run);
      kept.push(...runs);
    }
    if (!hit) return false;
    state.ink = kept;
    renderInk();
    return true;
  }

  ink.addEventListener("pointerdown", (e) => {
    if (pointer !== null) return;          // ignore extra fingers
    pointer = e.pointerId;
    ink.setPointerCapture(e.pointerId);
    pushUndo();
    const [nx, ny] = localPoint(e);
    if (eraseMode) eraseAt(nx, ny);
    else { live = [nx, ny]; renderInk(); }
    e.preventDefault();
  });

  ink.addEventListener("pointermove", (e) => {
    if (e.pointerId !== pointer) return;
    const [nx, ny] = localPoint(e);
    if (eraseMode) { eraseAt(nx, ny); return; }
    if (!live) return;
    const dx = nx - live[live.length - 2], dy = ny - live[live.length - 1];
    const min = 1.2 / (inkW() || 1);       // skip points closer than ~1px
    if (dx * dx + dy * dy < min * min) return;
    live.push(nx, ny);
    renderInk();
  });

  function endStroke(e) {
    if (e.pointerId !== pointer) return;
    pointer = null;
    if (live) {
      state.ink.push(live.map((v) => Math.round(v * 1e3) / 1e3));
      live = null;
    }
    let total = state.ink.reduce((n, s) => n + s.length, 0);
    while (total > MAX_POINTS && state.ink.length > 1) total -= state.ink.shift().length;
    noteChrome(); renderInk(); save();
  }
  ink.addEventListener("pointerup", endStroke);
  ink.addEventListener("pointercancel", endStroke);

  const ICON_PEN = modeBtn.innerHTML;
  const ICON_KEYBOARD =
    '<svg viewBox="0 0 24 24"><rect x="2" y="6" width="20" height="12" rx="2.5"/>' +
    '<path d="M6.5 10h.01M10 10h.01M13.5 10h.01M17 10h.01M8 14h8"/></svg>';

  function setDrawMode(on) {
    drawMode = on;
    if (!on) eraseMode = false;
    document.body.classList.toggle("note-draw", on);
    modeBtn.setAttribute("aria-pressed", String(on));
    modeBtn.setAttribute("aria-label", on ? "Switch to typing" : "Switch to drawing");
    modeBtn.title = on ? "Type" : "Draw";
    modeBtn.innerHTML = on ? ICON_KEYBOARD : ICON_PEN;
    if (on) noteEl.blur();
    noteChrome();
  }

  modeBtn.addEventListener("click", () => setDrawMode(!drawMode));

  eraseBtn.addEventListener("click", () => {
    eraseMode = !eraseMode;
    eraseBtn.setAttribute("aria-pressed", String(eraseMode));
  });

  undoBtn.addEventListener("click", () => {
    if (!undos.length) return;
    state.ink = JSON.parse(undos.pop());
    noteChrome(); renderInk(); save();
  });

  /* -------------------------------------------------------- note state */

  function noteChrome() {
    const noText = !noteEl.value.trim(), noInk = !state.ink.length;
    noteWrap.classList.toggle("empty", noText && noInk);
    // the buttons act on whichever layer you are working in
    noteClear.hidden = drawMode ? noInk : noText;
    noteClear.setAttribute("aria-label", drawMode ? "Clear the drawing" : "Clear the text");
    undoBtn.hidden = !drawMode;
    undoBtn.disabled = !undos.length;
    eraseBtn.hidden = !drawMode;
  }

  noteEl.value = state.note || "";

  noteEl.addEventListener("input", () => {
    state.note = noteEl.value;
    noteChrome(); fitNote(); save();
  });

  noteClear.addEventListener("click", () => {
    if (drawMode) {
      pushUndo();
      state.ink = [];
      renderInk();
    } else {
      noteEl.value = "";
      state.note = "";
      noteEl.blur();
      fitNote();
    }
    noteChrome(); save();
  });

  /* --------------------------------------------------------- fullscreen */

  const fullBtn = $("#note-full");
  const ICON_EXPAND = fullBtn.innerHTML;
  const ICON_SHRINK =
    '<svg viewBox="0 0 24 24"><path d="M20 4l-6 6"/><path d="M4 20l6-6"/>' +
    '<path d="M14 4v6h6"/><path d="M10 20v-6H4"/></svg>';

  function setFull(on) {
    document.body.classList.toggle("note-full", on);
    fullBtn.innerHTML = on ? ICON_SHRINK : ICON_EXPAND;
    fullBtn.setAttribute("aria-label", on ? "Leave fullscreen" : "Show fullscreen");
    fullBtn.title = on ? "Leave fullscreen" : "Fullscreen";
    // Real fullscreen also hides the browser's own chrome; where it is not
    // allowed (iOS Safari) the fixed-position panel above is already enough.
    if (on && !document.fullscreenElement && noteWrap.requestFullscreen) {
      noteWrap.requestFullscreen().catch(() => {});
    } else if (!on && document.fullscreenElement) {
      document.exitFullscreen().catch(() => {});
    }
    requestAnimationFrame(layoutNote);
  }

  fullBtn.addEventListener("click", () => setFull(!document.body.classList.contains("note-full")));

  document.addEventListener("fullscreenchange", () => {
    if (!document.fullscreenElement && document.body.classList.contains("note-full")) setFull(false);
    else requestAnimationFrame(layoutNote);
  });

  function layoutNote() {
    centreInk();
    renderInk();
    fitNote();
  }

  /* ------------------------------------------------------------- sheet */

  const sheet = $("#sheet"), scrim = $("#scrim"), paletteEl = $("#palette");

  function openSheet() {
    renderPalette();
    scrim.classList.add("show");
    sheet.classList.add("show");
  }
  function closeSheet() {
    scrim.classList.remove("show");
    sheet.classList.remove("show");
  }

  function renderPalette() {
    paletteEl.replaceChildren(...state.palette.map((cat) => {
      const row = document.createElement("div");
      row.className = "row";

      const sw = document.createElement("label");
      sw.className = "swatch";
      sw.style.background = cat.color;
      const inp = document.createElement("input");
      inp.type = "color";
      inp.value = cat.color;
      inp.setAttribute("aria-label", "Colour of " + (cat.name || "field"));
      inp.addEventListener("input", () => {
        cat.color = inp.value;
        sw.style.background = inp.value;
        save(); render();
      });
      sw.appendChild(inp);

      const name = document.createElement("input");
      name.className = "name";
      name.value = cat.name || "";
      name.placeholder = "Category (optional)";
      name.maxLength = 24;
      // the name is only read out by screen readers now, via each cell's label
      name.addEventListener("input", () => { cat.name = name.value; save(); render(); });

      const del = document.createElement("button");
      del.className = "del";
      del.textContent = "×";
      del.setAttribute("aria-label", "Remove colour");
      del.disabled = state.palette.length <= 2;
      del.addEventListener("click", () => {
        state.palette = state.palette.filter((p) => p.id !== cat.id);
        save(); renderPalette(); render();
      });

      row.append(sw, name, del);
      return row;
    }));
    $("#btn-add").disabled = state.palette.length >= 12;
  }

  // Draw the next colour from the presets, skipping any already in use: two
  // wedges of the same colour on the wheel read as one.
  const SPARES = [...new Set([...PRESETS[0].colors, ...PRESETS[4].colors, ...PRESETS[1].colors])];

  $("#btn-add").addEventListener("click", () => {
    if (state.palette.length >= 12) return;
    const used = new Set(state.palette.map((c) => c.color.toLowerCase()));
    const spare = SPARES.find((c) => !used.has(c)) || SPARES[0];
    state.palette.push({ id: uid(), color: spare, name: "Colour " + (state.palette.length + 1) });
    save(); renderPalette(); render();
  });

  $("#presets").replaceChildren(...PRESETS.map((preset) => {
    const b = document.createElement("button");
    b.className = "preset";
    b.title = preset.name;
    b.setAttribute("aria-label", "Preset " + preset.name);
    preset.colors.forEach((c) => {
      const i = document.createElement("i");
      i.style.background = c;
      b.appendChild(i);
    });
    b.addEventListener("click", () => {
      state.palette = preset.colors.map((c, i) => ({ id: uid(), color: c, name: "Colour " + (i + 1) }));
      save(); renderPalette(); newCard();
    });
    return b;
  }));

  /* ------------------------------------------------------------ controls */

  /* An in-app dialog, not confirm(). A sandboxed iframe — which is how the
     hosted build runs — ignores modal dialogs outright: nothing is shown to the
     user and confirm() simply returns false, so the new-card button did nothing
     as soon as there was anything to lose. */
  const askEl = $("#ask"), askText = $("#ask-text"),
        askYes = $("#ask-yes"), askNo = $("#ask-no");
  let settle = null;

  function ask(text, yesLabel) {
    askText.textContent = text;
    askYes.textContent = yesLabel;
    askEl.hidden = false;
    scrim.classList.add("show");
    askYes.focus();
    return new Promise((resolve) => { settle = resolve; });
  }

  // returns false when no dialog was open, so callers can fall through
  function closeAsk(answer) {
    if (!settle) return false;
    const resolve = settle;
    settle = null;
    askEl.hidden = true;
    if (!sheet.classList.contains("show")) scrim.classList.remove("show");
    resolve(answer);
    return true;
  }

  askYes.addEventListener("click", () => closeAsk(true));
  askNo.addEventListener("click", () => closeAsk(false));

  async function doNew() {
    const lose = [state.marks.some(Boolean) && "the marks",
                  state.ink.length && "the drawing"].filter(Boolean);
    if (lose.length &&
        !(await ask(`Start a new card? You will lose ${lose.join(" and ")}.`, "New card"))) return;
    newCard();
    closeSheet();
  }
  $("#btn-new").addEventListener("click", doNew);
  $("#btn-new-2").addEventListener("click", doNew);

  $("#btn-clear").addEventListener("click", () => {
    state.marks = new Array(CELLS).fill(false);
    state.seen = [];
    save(); render(); closeSheet();
  });

  $("#btn-settings").addEventListener("click", openSheet);
  $("#btn-close").addEventListener("click", closeSheet);
  scrim.addEventListener("click", () => { if (!closeAsk(false)) closeSheet(); });
  addEventListener("keydown", (e) => {
    if (e.key !== "Escape") return;
    if (closeAsk(false)) return;
    if (!wheelView.hidden) { closeWheel(); return; }
    if (sheet.classList.contains("show")) closeSheet();
    else if (document.body.classList.contains("note-full")) setFull(false);
  });

  for (const [id, key] of [["#opt-even", "even"], ["#opt-spread", "spread"], ["#opt-haptics", "haptics"]]) {
    const el = $(id);
    el.checked = !!state.settings[key];
    el.addEventListener("change", () => { state.settings[key] = el.checked; save(); });
  }

  /* ------------------------------------------------------------- PWA */

  let installPrompt = null;
  const installBtn = $("#btn-install");
  addEventListener("beforeinstallprompt", (e) => {
    e.preventDefault();
    installPrompt = e;
    installBtn.hidden = false;
  });
  installBtn.addEventListener("click", async () => {
    if (!installPrompt) return;
    installPrompt.prompt();
    await installPrompt.userChoice;
    installPrompt = null;
    installBtn.hidden = true;
  });

  if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
    addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
  }

  /* ----------------------------------------------------- category wheel */

  const wheelView = $("#wheel-view"), wheelStage = $("#wheel-stage"),
        wheelBox = $("#wheel-box"), wheelC = $("#wheel"),
        wheelBand = $("#wheel-band"), wheelCat = $("#wheel-cat");
  const wctx = wheelC.getContext("2d");
  const SPIN_MS = 3600, SPIN_TURNS = 5;
  const rad = (d) => (d * Math.PI) / 180;

  let rotation = 0;          // keeps growing, so the wheel always turns forwards
  let spinning = false, spinTimer = null, winner = null;

  const bodyFont = () => getComputedStyle(document.body).fontFamily;

  function drawWheel() {
    const box = wheelBox.clientWidth;
    if (!box) return;                       // hidden, nothing to draw yet
    const dpr = Math.min(devicePixelRatio || 1, 3);
    const px = Math.round(box * dpr);
    if (wheelC.width !== px) wheelC.width = wheelC.height = px;
    wctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    wctx.clearRect(0, 0, box, box);

    const pal = state.palette, n = pal.length, seg = 360 / n;
    const R = box / 2, fam = bodyFont();

    for (let i = 0; i < n; i++) {
      wctx.beginPath();
      wctx.moveTo(R, R);
      // -90 puts wedge 0 at the top, where the pin is
      wctx.arc(R, R, R - 1, rad(-90 + i * seg), rad(-90 + (i + 1) * seg));
      wctx.closePath();
      wctx.fillStyle = pal[i].color;
      wctx.fill();
      wctx.strokeStyle = "rgba(0,0,0,.28)";
      wctx.lineWidth = 1.5;
      wctx.stroke();
    }

    for (let i = 0; i < n; i++) {
      const name = (pal[i].name || "").trim();
      if (!name) continue;
      const midDeg = -90 + i * seg + seg / 2;
      // room for a label running along the radius, and across the wedge at its middle
      const maxLen = R * 0.62;
      const maxH = 2 * R * 0.6 * Math.tan(rad(Math.min(seg, 180) / 2)) * 0.62;
      let size = Math.min(R * 0.13, maxH);
      let text = name;
      const font = () => { wctx.font = `800 ${size}px ${fam}`; };
      font();
      while (size > 9 && wctx.measureText(text).width > maxLen) { size *= 0.9; font(); }
      while (text.length > 2 && wctx.measureText(text).width > maxLen) text = text.slice(0, -2) + "\u2026";

      wctx.save();
      wctx.translate(R, R);
      wctx.rotate(rad(midDeg));
      wctx.fillStyle = luminance(pal[i].color) > .45 ? "#000" : "#fff";
      wctx.textBaseline = "middle";
      /* After rotating by the wedge's angle, text reads upright only while that
         angle points east-ish. Between 90 and 270 degrees it comes out upside
         down, so flip it and draw from the rim inwards instead. */
      const a = ((midDeg % 360) + 360) % 360;
      if (a > 90 && a < 270) {
        wctx.rotate(Math.PI);
        wctx.textAlign = "left";
        wctx.fillText(text, -(R * 0.9), 0);
      } else {
        wctx.textAlign = "right";
        wctx.fillText(text, R * 0.9, 0);
      }
      wctx.restore();
    }

    // hub
    wctx.beginPath();
    wctx.arc(R, R, Math.max(12, R * 0.1), 0, Math.PI * 2);
    wctx.fillStyle = getComputedStyle(document.body).backgroundColor;
    wctx.fill();
    wctx.strokeStyle = "rgba(0,0,0,.28)";
    wctx.lineWidth = 2;
    wctx.stroke();

    wheelC.setAttribute("aria-label",
      `Wheel with ${n} categories: ` +
      pal.map((c, i) => (c.name || "").trim() || `colour ${i + 1}`).join(", "));
  }

  function fitWheel() {
    const side = Math.floor(Math.min(wheelStage.clientWidth, wheelStage.clientHeight));
    if (side > 0) wheelBox.style.setProperty("--wside", side + "px");
    drawWheel();
    if (winner !== null) fitBand();
  }
  new ResizeObserver(fitWheel).observe(wheelStage);

  // the band's text is one line; the wheel's own context measures it, so the
  // font is the same one it will be rendered with
  function fitBand() {
    const text = wheelCat.textContent;
    if (!text) return;
    const w = wheelBand.clientWidth - 34, h = wheelBand.clientHeight - 18;
    if (w <= 0 || h <= 0) return;
    let size = Math.min(h * .78, 190);
    const font = () => { wctx.font = `800 ${size}px ${bodyFont()}`; };
    font();
    while (size > 12 && wctx.measureText(text).width > w) { size *= .93; font(); }
    wheelCat.style.fontSize = size.toFixed(1) + "px";
  }

  function clearResult() {
    winner = null;
    wheelBand.hidden = true;
    wheelView.classList.remove("has-result");
  }

  function showResult(i) {
    const cat = state.palette[i];
    winner = i;
    wheelBand.style.background = cat.color;
    wheelCat.style.color = luminance(cat.color) > .45 ? "#000" : "#fff";
    wheelCat.textContent = (cat.name || "").trim();
    wheelBand.hidden = false;
    wheelView.classList.add("has-result");
    fitBand();
  }

  /* The winner is drawn first and the wheel is then turned to it. Spinning by a
     random amount and reading off where it stopped would make fairness depend on
     the easing curve, and lands ambiguously on a wedge boundary. */
  function spin() {
    const n = state.palette.length;
    if (spinning || !n) return;
    const seg = 360 / n;
    const pick = Math.floor(Math.random() * n);
    const target = ((-(pick * seg + seg / 2) % 360) + 360) % 360;
    const current = ((rotation % 360) + 360) % 360;
    const delta = ((target - current) % 360 + 360) % 360;
    const still = matchMedia("(prefers-reduced-motion: reduce)").matches;

    rotation += (still ? 0 : 360 * SPIN_TURNS) + delta;
    clearResult();
    spinning = true;
    wheelView.classList.add("spinning");
    wheelC.style.transition = still ? "none" : `transform ${SPIN_MS}ms cubic-bezier(.16,.84,.06,1)`;
    wheelC.style.transform = `rotate(${rotation}deg)`;

    clearTimeout(spinTimer);
    const land = () => {
      spinning = false;
      wheelView.classList.remove("spinning");
      showResult(pick);
      if (state.settings.haptics && navigator.vibrate) navigator.vibrate([25, 50, 90]);
    };
    if (still) requestAnimationFrame(land);
    else spinTimer = setTimeout(land, SPIN_MS + 60);
  }

  wheelC.addEventListener("click", spin);

  function openWheel() {
    wheelView.hidden = false;
    clearResult();
    if (wheelView.requestFullscreen) wheelView.requestFullscreen().catch(() => {});
    requestAnimationFrame(fitWheel);
  }

  function closeWheel() {
    clearTimeout(spinTimer);
    spinning = false;
    wheelView.classList.remove("spinning");
    wheelView.hidden = true;
    if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
  }

  $("#btn-wheel").addEventListener("click", openWheel);
  $("#wheel-close").addEventListener("click", closeWheel);

  /* ------------------------------------------------- keep the card square */

  const main = document.querySelector("main");
  // must match the media query in the stylesheet
  const WIDE = matchMedia("(orientation: landscape) and (min-width: 620px)");
  const MIN_FIELD = 220;      // never squeeze the field below this in landscape

  function fit() {
    let side;
    if (WIDE.matches) {
      /* Side by side, the card is as big as the row is tall — but capped so the
         field keeps a usable width on an almost-square window. Deliberately not
         derived from main's width, which is the column this then sets. */
      const inner = document.body.clientWidth - 24;          // body's side padding
      side = Math.floor(Math.min(main.clientHeight, inner - 12 - MIN_FIELD));
      if (side > 0) document.body.style.gridTemplateColumns = side + "px minmax(0, 1fr)";
    } else {
      side = Math.floor(Math.min(main.clientWidth, main.clientHeight));
      document.body.style.gridTemplateColumns = "";
    }
    if (side > 0) cardEl.style.setProperty("--side", side + "px");
    layoutNote();
  }
  WIDE.addEventListener("change", fit);
  new ResizeObserver(fit).observe(main);
  new ResizeObserver(layoutNote).observe(noteWrap);

  // the pen colour follows the theme, so redraw when the theme flips
  matchMedia("(prefers-color-scheme: light)").addEventListener("change", renderInk);
  new MutationObserver(renderInk)
    .observe(document.documentElement, { attributeFilter: ["data-theme"] });
  addEventListener("orientationchange", () => setTimeout(fit, 120));

  if (!state.card) newCard(); else render();
  setDrawMode(false);
  fit();
})();
</script>
</body>
</html>
